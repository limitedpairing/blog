<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph / Twitter Card (link preview thumbnail) -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-card.jpg' | absolute_url }}">
  <meta property="og:image:secure_url" content="{{ '/assets/images/og-card.jpg' | absolute_url }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LIMITED PAIRING 후기">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/images/og-card.jpg' | absolute_url }}">

  <!-- Pretendard -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <main class="page">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="확대 이미지">
    <button class="lightbox__close" type="button" aria-label="닫기">&times;</button>
    <img class="lightbox__img" alt="">
  </div>
  <script>
  (function () {
    var lb = document.getElementById('lightbox');
    if (!lb) return;
    var lbImg = lb.querySelector('.lightbox__img');
    function isOpen() { return lb.classList.contains('open'); }
    function openLb(src) {
      lbImg.setAttribute('src', src);
      lb.style.display = 'flex';      // drive display from JS so it never depends on cached CSS
      lb.classList.add('open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.classList.add('lb-lock');
    }
    function closeLb() {
      lb.style.display = 'none';
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden', 'true');
      lbImg.removeAttribute('src');
      document.body.classList.remove('lb-lock');
    }
    document.addEventListener('click', function (e) {
      if (isOpen()) { closeLb(); return; }              // any click closes it
      var fig = e.target.closest('.photo');
      if (fig && !fig.classList.contains('photo--missing')) {
        var im = fig.querySelector('img');
        if (im && im.getAttribute('src')) {
          e.preventDefault();
          openLb(im.currentSrc || im.src);
        }
      }
    }, false);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && isOpen()) closeLb();
    });
  })();
  </script>
</body>
</html>
