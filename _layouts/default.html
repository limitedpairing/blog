<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Pretendard -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <main class="page">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="확대 이미지">
    <button class="lightbox__close" type="button" aria-label="닫기">&times;</button>
    <img class="lightbox__img" alt="">
  </div>
  <script>
  (function () {
    var lb = document.getElementById('lightbox');
    if (!lb) return;
    var lbImg = lb.querySelector('.lightbox__img');
    function open(src) {
      lbImg.src = src;
      lb.classList.add('open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      lbImg.removeAttribute('src');
    }
    document.addEventListener('click', function (e) {
      var img = e.target.closest('.photo > img');
      if (img && !img.closest('.photo--missing') && img.naturalWidth > 0) {
        open(img.currentSrc || img.src);
        return;
      }
      if (e.target === lb || e.target.closest('.lightbox__close') || e.target === lbImg) close();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && lb.classList.contains('open')) close();
    });
  })();
  </script>
</body>
</html>
